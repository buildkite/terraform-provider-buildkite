env:
  # Persistent fixtures required by shared admin/non-admin acceptance tests. Do not delete.
  BUILDKITE_NONADMIN_PIPELINE_TEAM_SLUG: "terraform-provider-non-admin-pipeline-team"
  BUILDKITE_NONADMIN_RULE_HIDDEN_PIPELINE_UUID: "01a1acbc-eae9-4689-bbe0-a6365f77469d"
  BUILDKITE_NONADMIN_RULE_SOURCE_ONLY_UUID: "01a1acbe-c891-7935-9849-23e51bcbb1bd"
  BUILDKITE_NONADMIN_RULE_TARGET_ONLY_UUID: "01a1acbe-c8d8-7af1-bd85-069d1d888838"
  BUILDKITE_NONADMIN_RULE_UUID: "01a1ac8d-4aa6-7bf4-b3b2-842a4578de37"

steps:
  - label: ":golangci-lint: lint"
    key: lint
    command : golangci-lint run --timeout 2m0s
    agents:
      queue: "hosted"
    plugins:
      - docker#v5.14.0:
          image: "golangci/golangci-lint:v2.11.3"
          always-pull: true
          volumes:
            - "/.cache/golangci-lint/v2.11.3:/root/.cache"

  - label: vet
    key: vet
    command: "make vet"
    agents:
      queue: "hosted"
    plugins:
      docker-compose#v5.16.0:
        run: go

  - label: docs
    key: docs
    command: .buildkite/steps/documentation.sh
    agents:
      queue: "hosted"
    plugins:
      docker-compose#v5.16.0:
        run: go
        mount-buildkite-agent: true

  - label: test
    key: test
    command: "make test"
    agents:
      queue: "hosted"
    plugins:
      docker-compose#v5.16.0:
        run: go

  - label: acceptance tests
    key: testacc
    concurrency: 1
    concurrency_group: terraform-provider-acceptance-tests
    command: .buildkite/steps/annotate.sh
    artifact_paths:
      - "test-events-*.jsonl"
      - "junit-*.xml"
    plugins:
      - aws-assume-role-with-web-identity#v1.8.1:
          role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-terraform-provider-buildkite-main
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
      - aws-ssm#v1.1.0:
          parameters:
            BUILDKITE_ORGANIZATION_SLUG: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_organization
            BUILDKITE_API_TOKEN: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_api_token
            BUILDKITE_NONADMIN_API_TOKEN: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_api_token_nonadmin
            BUILDKITE_ANALYTICS_TOKEN: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_analytics_token
            GITHUB_TEST_REPO: /pipelines/buildkite/terraform-provider-buildkite-main/github_test_repo
            GITHUB_TEST_REPO_ALT: /pipelines/buildkite/terraform-provider-buildkite-main/github_test_repo_alt
      - docker-compose#v5.16.0:
          run: acceptance
          mount-buildkite-agent: "true"
      - test-collector#v1.12.0:
          files: junit-*.xml
          format: junit
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: acceptance tests - non-admin
    key: testacc-nonadmin
    concurrency: 1
    concurrency_group: terraform-provider-acceptance-tests
    command: .buildkite/steps/annotate.sh testacc-nonadmin
    artifact_paths:
      - "test-events-*.jsonl"
      - "junit-*.xml"
    plugins:
      - aws-assume-role-with-web-identity#v1.8.1:
          role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-terraform-provider-buildkite-main
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
      - aws-ssm#v1.1.0:
          parameters:
            BUILDKITE_ORGANIZATION_SLUG: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_organization
            BUILDKITE_API_TOKEN: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_api_token_nonadmin
            BUILDKITE_ANALYTICS_TOKEN: /pipelines/buildkite/terraform-provider-buildkite-main/buildkite_analytics_token
      - docker-compose#v5.16.0:
          run: acceptance
          mount-buildkite-agent: "true"
      - test-collector#v1.12.0:
          files: junit-*.xml
          format: junit
    retry:
      automatic:
        - exit_status: -1
          limit: 2

  - label: "Security Scan"
    key: security_scan
    secrets:
      GITHUB_TOKEN: SCORECARD_TOKEN
    plugins:
      - ossf-scorecard#v1.1.0:
          github_token: $$GITHUB_TOKEN
    retry:
      automatic:
        - exit_status: "*"
          limit: 2

  - label: build
    command: "make build-snapshot"
    agents:
      queue: "hosted"
    plugins:
      docker-compose#v5.16.0:
        run: go
    depends_on:
      - lint
      - test
      - testacc
      - testacc-nonadmin
      - vet
      - docs
