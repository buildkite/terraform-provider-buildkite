version: "3.5"

services:
  go: &go
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    volumes:
      - .:/work
      - go-pkg-mod:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /work
    environment:
      - BUILDKIT_PROGRESS=plain
      - DOCKER_BUILDKIT=1
      - BUILDKITE_ANALYTICS_TOKEN
      - BUILDKITE_API_TOKEN
      - BUILDKITE_CACHE_REGISTRIES_ACCEPTANCE
      - BUILDKITE_GRAPHQL_URL
      - BUILDKITE_REST_URL
      - BUILDKITE_BRANCH
      - BUILDKITE_BUILD_NUMBER
      - BUILDKITE_BUILD_URL
      - BUILDKITE_COMMIT
      - BUILDKITE_JOB_ID
      - BUILDKITE_MESSAGE
      - BUILDKITE_ORGANIZATION_SLUG
      - GITHUB_TEST_REPO
      - GITHUB_TEST_REPO_ALT
      - BUILDKITE_TAG
      - GITHUB_TOKEN
      - GPG_SECRET_KEY_BASE64

  acceptance:
    <<: *go
    build:
      context: .
      dockerfile: Dockerfile
      target: test

volumes:
  go-pkg-mod:
  go-build-cache:
