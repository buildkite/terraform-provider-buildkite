query getTestSuite(
    $id: ID!,
    $teamCount: Int,
    # @genqlient(pointer: true)
    $teamCursor: String,
) {
    suite: node(id: $id) {
        ... on Suite {
            id
            uuid
            defaultBranch
            # @genqlient(pointer: true)
            emoji
            name
            slug
            teams(first: $teamCount, after: $teamCursor, order: NAME) {
                pageInfo {
                    hasNextPage
                    endCursor
                }
                edges {
                    node {
                        id
                        accessLevel
                        team {
                            id
                        }
                    }
                }
            }
        }
    }
}
