query GetOrganizationMemberByEmail(
    $slug: ID!,
    $email: String
) {
    organization(slug: $slug) {
        id
        members(first: 1, email: $email) {
            edges {
                node {
                    user {
                        id
                        uuid
                        name
                        email
                    }
                }
            }
        }
    }
}
