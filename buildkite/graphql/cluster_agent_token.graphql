fragment ClusterAgentTokenValues on ClusterToken {
    allowedIpAddresses
    cluster {
        id
        uuid
    }
    description
    # @genqlient(pointer: true)
    expiresAt
    id
    uuid
    permissions
    # @genqlient(pointer: true)
    allowAllQueues
    allowedQueueIds
}

query getClusterAgentToken($id: ID!) {
    node(id: $id) {
        ... on ClusterToken {
            ... ClusterAgentTokenValues
            cluster {
                id
                uuid
                organization {
                    slug
                }
            }
        }
    }
}

query getClusterAgentTokens($orgSlug: ID!, $id: ID!) {
    organization(slug: $orgSlug) {
        cluster(id: $id) {
            agentTokens(first: 50) {
                edges {
                    node {
                        ... ClusterAgentTokenValues
                    }
                }
            }
        }
    }
}

mutation createClusterAgentToken(
    $organizationId: ID!
    $clusterId: ID!
    $description: String!
    $allowedIpAddresses: String
    # @genqlient(pointer: true, omitempty: true)
    $expiresAt: DateTime
    # @genqlient(bind: "*[]string", omitempty: true)
    $permissions: [String!]
    # @genqlient(pointer: true, omitempty: true)
    $allowAllQueues: Boolean
    # @genqlient(bind: "*[]string", omitempty: true)
    $allowedQueueIds: [ID!]
) {
        clusterAgentTokenCreate(input:{
            organizationId: $organizationId
            clusterId: $clusterId
            description: $description
            allowedIpAddresses: $allowedIpAddresses
            expiresAt: $expiresAt
            permissions: $permissions
            allowAllQueues: $allowAllQueues
            allowedQueueIds: $allowedQueueIds
        }) {
            clusterAgentToken {
                ... ClusterAgentTokenValues
            }
            tokenValue
        }

}


mutation revokeClusterAgentToken(
    $organizationId: ID!
    $id: ID!
) {
    clusterAgentTokenRevoke(input: {
        organizationId: $organizationId
        id: $id
    }) {
        deletedClusterAgentTokenId
    }
}


mutation updateClusterAgentToken(
    $organizationId: ID!
    $id: ID!
    $description: String!
    $allowedIpAddresses: String
    # @genqlient(bind: "*[]string", omitempty: true)
    $permissions: [String!]
    # @genqlient(pointer: true, omitempty: true)
    $allowAllQueues: Boolean
    # @genqlient(bind: "*[]string", omitempty: true)
    $allowedQueueIds: [ID!]
) {
    clusterAgentTokenUpdate(input: {
        organizationId: $organizationId
        id: $id
        description: $description
        allowedIpAddresses: $allowedIpAddresses
        permissions: $permissions
        allowAllQueues: $allowAllQueues
        allowedQueueIds: $allowedQueueIds
    }) {
        clusterAgentToken {
            ... ClusterAgentTokenValues
        }
    }
}
